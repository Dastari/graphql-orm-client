[package]
name = "client-conformance-service"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
graphql-orm = { git = "https://github.com/Dastari/graphql-orm", tag = "graphql-orm-v0.90.1", features = ["sqlite", "router-protocol", "resolver-case-pascal", "argument-case-pascal", "field-case-pascal"] }
graphql-orm-router-protocol = { git = "https://github.com/Dastari/graphql-orm", tag = "graphql-orm-v0.90.1" }
async-graphql = { version = "7", default-features = false }
async-graphql-axum = "7"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev]
debug = 0
