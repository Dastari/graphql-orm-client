name: Conformance
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'conformance/**'
      - '.github/workflows/conformance.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
permissions:
  contents: read
jobs:
  router:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        graphql-orm: [graphql-orm-v0.90.1, graphql-orm-v0.91.1, graphql-orm-v0.93.0, graphql-orm-v0.94.0]
    env:
      GRAPHQL_ORM_TAG: ${{ matrix.graphql-orm }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      # Prints the cause of a service INTERNAL_ERROR, which is otherwise masked.
      GRAPHQL_ORM_LOG_INTERNAL_ERRORS: '1'
    steps:
      # The runner context isn't available in job-level env, which made the whole workflow file invalid.
      - run: |
          echo "CONFORMANCE_SCRATCH=$RUNNER_TEMP/conformance" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/conformance/target" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@59a558e8c538bf4a23bbffa19e5a278b703f2920 # 1.97.1 branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: conformance/service -> ${{ runner.temp }}/conformance/target
          key: ${{ matrix.graphql-orm }}
      - run: df -h "$RUNNER_TEMP"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium firefox webkit
      - run: pnpm check
      - run: pnpm build
      - run: pnpm conformance
      - run: pnpm pack --dry-run
