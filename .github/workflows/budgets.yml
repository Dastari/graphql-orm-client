name: Budgets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm budgets | tee budgets-report.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budgets-report
          path: budgets-report.txt
